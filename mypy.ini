[mypy]

# Third-party packages without usable type information. Listing them here means
# a build only needs mypy itself - pip's isolated build environment does not
# have to install click and friends just to type-check the compile.

[mypy-rich.*]
ignore_missing_imports = True

[mypy-prompt_toolkit.*]
ignore_missing_imports = True

[mypy-pygments.*]
ignore_missing_imports = True

[mypy-click.*]
ignore_missing_imports = True
